<!DOCTYPE html>
<html lang="{{.Locale}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Labels.app_title}}</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <script src="/static/js/tailwind-cdn.js"></script>
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/alpine.min.js" defer></script>
    <style>
        .font-serif-accent {
            font-family: Georgia, 'Times New Roman', serif;
        }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="bg-emerald-900 text-amber-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="font-serif-accent text-xl font-bold tracking-wide text-amber-200 hover:text-amber-100 transition-colors">
                Heidelguide
            </a>
            <div class="flex items-center gap-4">
                <form method="POST" action="/language" class="flex items-center gap-1">
                    <button type="submit" name="locale" value="de"
                        class="px-2 py-1 text-sm rounded transition-colors {{if eq .Locale "de"}}bg-amber-600 text-white font-semibold{{else}}bg-emerald-800 text-stone-300 hover:bg-emerald-700{{end}}">
                        DE
                    </button>
                    <button type="submit" name="locale" value="en"
                        class="px-2 py-1 text-sm rounded transition-colors {{if eq .Locale "en"}}bg-amber-600 text-white font-semibold{{else}}bg-emerald-800 text-stone-300 hover:bg-emerald-700{{end}}">
                        EN
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1">
        {{block "content" .}}{{end}}
    </main>

    <!-- Footer -->
    <footer class="bg-emerald-900 text-stone-400 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm space-y-1">
            <p>Heidelguide: A demo app for Spec-Driven Development</p>
            <p>Built with <a href="https://kiro.dev" target="_blank" rel="noopener" class="text-amber-200/70 hover:text-amber-100 underline">Kiro</a> &middot; Hosted on <a href="https://www.digitalocean.com" target="_blank" rel="noopener" class="text-amber-200/70 hover:text-amber-100 underline">DigitalOcean</a> &middot; Source on <a href="https://github.com/gimmebytes/heidelguide" target="_blank" rel="noopener" class="text-amber-200/70 hover:text-amber-100 underline">GitHub</a></p>
        </div>
    </footer>
</body>
</html>
